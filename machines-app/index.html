<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فحص الماكينات</title>
<meta name="theme-color" content="#1d2321">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="فحص الماكينات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f3f4f2; --surface:#ffffff; --surface-2:#eceeeb; --line:#d9dcd6;
  --fg:#1d2321; --muted:#5d6762; --accent:#b4620f; --accent-ink:#ffffff; --accent-soft:#f6e6d3;
  --ok:#1f7a4a; --ok-soft:#dcefe3; --bad:#b3261e; --bad-soft:#f7dedb; --off:#6a6f7a; --off-soft:#e3e4e8; --wa:#128c4a;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141816; --surface:#1d2220; --surface-2:#252b28; --line:#333b37;
  --fg:#e8ebe7; --muted:#9aa49f; --accent:#e89a45; --accent-ink:#1b1206; --accent-soft:#3a2a17;
  --ok:#5cc58b; --ok-soft:#173226; --bad:#f08077; --bad-soft:#3a1d1a; --off:#a3a8b3; --off-soft:#2a2d33; --wa:#1a8f4f;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

/* ---------- auth screens ---------- */
.auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.auth .box{width:100%;max-width:380px;display:grid;gap:14px}
.auth .logo{width:72px;height:72px;border-radius:18px}
.auth h1{font-size:1.5rem}
.auth p{margin:0;color:var(--muted)}
.field{display:grid;gap:4px}
.field label{font-size:.85rem;color:var(--muted)}
.field input,.field select{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;width:100%}
.ltr{direction:ltr;text-align:left}
.err{color:var(--bad);font-size:.88rem;min-height:1.2em}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;text-align:right}
.demo{background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:8px 12px;font-size:.85rem}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:12px 18px;font-size:1rem;border-radius:12px}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.alert{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55}
.btn[aria-pressed="true"]{background:var(--off);border-color:var(--off);color:#fff}

/* ---------- app shell ---------- */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.topbar h1+.who{margin-top:-2px}
.topbar .row1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar h1{font-size:1.15rem}
.who{font-size:.82rem;color:var(--muted)}
.offline{font-size:.75rem;background:var(--off-soft);color:var(--off);border-radius:99px;padding:2px 8px}
main{padding:12px 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.75rem;color:var(--muted);font-weight:600}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* ---------- check screen ---------- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=date]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 8px;min-height:36px;font-size:.88rem;max-width:150px}
.progress{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.meter{flex:1 1 200px;height:9px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.m-ok{background:var(--ok)}.m-bad{background:var(--bad)}.m-off{background:var(--off)}
.stats{display:flex;gap:12px;font-size:.85rem;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats b{font-family:var(--display)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:4px;vertical-align:middle}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:4px 0 10px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip small{opacity:.7;font-variant-numeric:tabular-nums}
.sep{flex:0 0 1px;background:var(--line);margin-inline:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.card[data-state="ok"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.card[data-state="bad"]{border-color:var(--bad)}
.head{display:flex;gap:12px;align-items:center;width:100%;border:0;background:transparent;padding:10px;text-align:right}
.ph{flex:0 0 auto;width:62px;height:84px;border-radius:9px;background:var(--surface-2);overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.num{position:absolute;top:4px;inset-inline-start:4px;background:var(--fg);color:var(--bg);font-family:var(--display);font-size:.72rem;font-weight:600;border-radius:6px;padding:0 5px}
.info{flex:1;min-width:0}
.name{font-weight:600;line-height:1.35}
.brand{color:var(--muted);font-size:.8rem;unicode-bidi:plaintext;text-align:right;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:.76rem;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.off{background:var(--off-soft);color:var(--off)}.pill.part{background:var(--accent-soft);color:var(--accent)}
.chev{flex:0 0 auto;color:var(--muted);transition:transform .15s}
.card.open .chev{transform:rotate(180deg)}
.body{border-top:1px solid var(--line);padding:10px 12px 12px;display:grid;gap:8px}
.crow{display:flex;gap:8px;align-items:center}
.crow .lbl{flex:1;min-width:0;font-size:.92rem}
.tog{display:inline-flex;gap:4px}
.tog button{border:1px solid var(--line);background:var(--surface);border-radius:9px;min-width:46px;height:40px;font-weight:700;color:var(--muted)}
.tog .y[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tog .n[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.acts{display:flex;flex-wrap:wrap;gap:6px}
textarea{width:100%;min-height:58px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px;font-size:16px}
.stopped .crow{opacity:.4}
.meta{font-size:.76rem;color:var(--muted)}
.panel{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-size:1rem;margin-bottom:8px}
.issues{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.issues li{display:flex;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:8px}
.issues li:last-child{border-bottom:0}
.issues .n{font-family:var(--display);font-weight:600;color:var(--bad);min-width:26px}
.empty{color:var(--muted);font-size:.9rem}
.sendbar{position:fixed;inset-inline:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:8px 16px}
.sendbar .in{max-width:1180px;margin:0 auto;display:flex;gap:8px 12px;align-items:center;justify-content:space-between}
.sendbar .st{font-size:.8rem;color:var(--muted);min-width:0}
.sendbar .st b{color:var(--ok)}
.sheetbg{position:fixed;inset:0;z-index:20;background:rgba(10,14,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media (min-width:700px){.sheetbg{align-items:center}}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100dvh - 40px);overflow:auto;padding:16px;display:grid;gap:12px}
.warn{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.warn b{color:var(--accent)}
.warn ul{margin:6px 0 0;padding-inline-start:18px;max-height:22vh;overflow:auto}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;font-family:var(--body);font-size:.86rem;max-height:38vh;overflow:auto}

/* ---------- lists (history / users / account) ---------- */
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.item .t{font-weight:600}
.item .s{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tag{font-size:.72rem;font-weight:600;border-radius:99px;padding:1px 8px;background:var(--surface-2);color:var(--muted)}
.tag.admin{background:var(--accent-soft);color:var(--accent)}
.tag.off{background:var(--bad-soft);color:var(--bad)}
.nums{display:flex;gap:10px;font-size:.82rem;font-variant-numeric:tabular-nums}
.form{display:grid;gap:10px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.form .two{grid-template-columns:1fr}}
.sectionT{font-size:1.05rem;margin:4px 0 10px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:.88rem;z-index:30}
.ios{display:grid;gap:6px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="auth"><div class="box"><img class="logo" src="icons/icon-192.png" alt=""><p>جاري التحميل…</p></div></div></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
